name: Pruebas del backend
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Instalar herramientas
        run: python -m pip install -r requirements.txt pytest-cov==7.1.0 ruff==0.17.5 bandit==1.9.4
      - name: Revisar estilo con Ruff
        run: python -m ruff check app tests
      - name: Revisar seguridad con Bandit
        run: python -m bandit -q -r app
      - name: Ejecutar pruebas y comprobar cobertura
        run: python -m pytest -q --cov=app.apuestas --cov=app.bankroll --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60
      - name: Guardar reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/coverage.xml
